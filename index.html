<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Builder</title>
<style>
:root{--ink:#1b2430;--mut:#5b6673;--line:#d9dee4;--acc:#1f5f5b;--bg:#eef1f3}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.bar b{font-size:15px;margin-right:6px}
.bar .sp{flex:1}
button,select{font:inherit;padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(330px,420px) 1fr}
.ed,.pv{height:calc(100vh - 56px);overflow:auto;padding:14px}
.ed{background:#fff;border-right:1px solid var(--line)}
.ed>details{border-bottom:1px solid var(--line);padding:6px 0}
.ed summary{cursor:pointer;font-weight:600;padding:6px 0}
label{display:block;margin:8px 0 0;font-size:12px;color:var(--mut)}
input[type=text],input:not([type]),textarea{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:13px/1.4 inherit;color:var(--ink);background:#fff}
textarea{resize:vertical}
.ih{display:flex;gap:8px;align-items:flex-start;margin:4px 0;padding:4px 0;border-top:1px dashed var(--line)}
.ih>input{margin-top:9px}
.ih>details{flex:1;min-width:0}
.ih summary{font-weight:500;padding:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:6px;margin:10px 0 4px}
.row button{padding:4px 9px;font-size:12px}
.add{margin:6px 0}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.paper{max-width:794px;margin:0 auto;background:#fff;padding:42px 48px;box-shadow:0 2px 12px rgba(0,0,0,.12);font:13px/1.4 Arial,Helvetica,sans-serif;color:#000;min-height:600px}
.paper h1{font-size:24px;margin:0 0 2px}
.paper .t{font-size:14px;font-weight:bold;margin:0 0 3px}
.paper .c{margin:0 0 6px;word-break:break-word}
.paper h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;padding-bottom:2px;border-bottom:1.5px solid #000}
.paper p{margin:0 0 6px}
.paper .h{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.paper .h span{white-space:nowrap}
.paper .s{font-style:italic;margin-bottom:2px}
.paper ul{margin:2px 0 4px;padding-left:20px}
.paper li{margin-bottom:2px}
.paper.cl p{margin-bottom:11px}
.chip{display:inline-block;margin:0 5px 6px 0;padding:3px 9px;border-radius:12px;font-size:12px;border:1px solid}
.ok{background:#e6f3ec;border-color:#9fcdb2;color:#14502d}
.no{background:#fbeaea;border-color:#e2a3a3;color:#7a1c1c}
.score{font-size:30px;font-weight:bold}
@media(max-width:900px){.app{display:block}.ed,.pv{height:auto}.paper{padding:22px 18px}}
@page{size:A4;margin:12mm 13mm}
@media print{
body{background:#fff}.bar,.ed,.tabs{display:none!important}
.app{display:block}.pv{height:auto;overflow:visible;padding:0}
.paper{box-shadow:none;max-width:none;padding:0;min-height:0;font-size:10pt}
.paper.kw{display:none}
.paper h1{font-size:20pt}.paper .t{font-size:11pt}.paper h2{font-size:10.5pt}
.paper li,.paper .h,.paper .s{break-inside:avoid}.paper h2,.paper .h,.paper .s{break-after:avoid}
}
</style>
</head>
<body>
<div class="bar">
  <b>CV Builder</b>
  <select id="ver" aria-label="Saved version"></select>
  <button data-g="new">Save as new version</button>
  <button data-g="blank">New blank CV</button>
  <button data-g="ren">Rename</button>
  <button data-g="del">Delete</button>
  <span class="sp"></span>
  <button data-g="exp">Backup</button>
  <button data-g="imp">Restore</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="p" data-g="print">Print / Save as PDF</button>
</div>
<div class="app">
  <div class="ed" id="ed"></div>
  <div class="pv">
    <div class="tabs">
      <button data-t="cv">CV</button><button data-t="cl">Cover letter</button><button data-t="kw">Keyword match</button>
    </div>
    <div class="paper" id="paper"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- Your master data: edit here or in the app ---------- */
const DEF={
jd:'',
name:'Alex Morgan',
title:'Software Engineer | Full-Stack Developer',
email:'alex.morgan@email.com',
phone:'+00 000 000 0000',
loc:'City, Country',
links:'yourportfolio.com\nlinkedin.com/in/your-name\ngithub.com/your-username',
summary:'Software Engineer with X years of experience building web applications, REST APIs and database-driven systems. Skilled in [your main languages and frameworks]. Replace this with 2-3 sentences that mirror the job you are applying for.',
skills:[
{on:1,label:'Programming Languages',items:'JavaScript, TypeScript, Python, SQL'},
{on:1,label:'Frontend Development',items:'React.js, HTML5, CSS3, Tailwind CSS'},
{on:1,label:'Backend Development',items:'Node.js, Express.js, REST APIs'},
{on:1,label:'Databases',items:'MySQL, PostgreSQL, MongoDB'},
{on:1,label:'Tools and Deployment',items:'Git, GitHub, Docker, Postman, CI/CD'}],
exp:[
{on:1,role:'Job Title',org:'Company Name',loc:'City, Country',dates:'MM/YYYY - MM/YYYY',b:'Start each bullet with a strong verb and say what you built or improved.\nAdd numbers where you can, for example: reduced page load time by 30%.\nMention the technologies you used in the job.'}],
proj:[
{on:1,name:'Project Name - Short Description',tech:'React.js, Node.js, MongoDB',dates:'YYYY',b:'What the project does and who it is for.\nYour specific contribution and the result.'}],
edu:[
{on:1,degree:'Degree Name',school:'University Name',dates:'YYYY - YYYY',b:''}],
awards:[
{on:0,text:'Award or certification name, Issuer',dates:'MM/YYYY'}],
cl:{company:'',role:'',manager:'',date:'',sign:'Kind regards,',
body:'I am writing to apply for the {role} position at {company}. I am a [your title] with [X years] of experience in [your main area], and I am excited by the chance to contribute to your team.\n\nIn my most recent role at [Company], I [describe your strongest relevant achievement]. I work with [key technologies from the job description], and I enjoy turning requirements into reliable, maintainable software.\n\nI am drawn to {company} because [one specific reason: its product, mission or technology]. I would welcome the opportunity to discuss how my experience can support your team. Thank you for your time and consideration.'}
};
const EMPTY={jd:'',name:'',title:'',email:'',phone:'',loc:'',links:'',summary:'',skills:[],exp:[],proj:[],edu:[],awards:[],cl:{company:'',role:'',manager:'',date:'',sign:'Kind regards,',body:''}};
const NEW={skills:{on:1,label:'',items:''},exp:{on:1,role:'',org:'',loc:'',dates:'',b:''},proj:{on:1,name:'',tech:'',dates:'',b:''},edu:{on:1,degree:'',school:'',dates:'',b:''},awards:{on:1,text:'',dates:''}};
const LISTS={
skills:{t:'Technical skills',h:'label',f:[['label','Category'],['items','Skills, comma separated',3]]},
exp:{t:'Professional experience',h:'role',f:[['role','Job title'],['org','Company'],['loc','Location'],['dates','Dates'],['b','Bullets, one per line',8]]},
proj:{t:'Projects',h:'name',f:[['name','Project name'],['tech','Tech stack'],['dates','Year'],['b','Bullets, one per line',5]]},
edu:{t:'Education',h:'degree',f:[['degree','Degree'],['school','Institution'],['dates','Dates'],['b','Notes, one per line',2]]},
awards:{t:'Awards',h:'text',f:[['text','Award'],['dates','Date']]}};

/* ---------- State and storage ---------- */
let V=null,tab='cv';
try{V=JSON.parse(localStorage.getItem('cvb2'))}catch(e){}
if(!V||!V.list||!V.list.length)V={cur:1,list:[{id:1,name:'Master CV',data:clone(DEF)}]};
const save=()=>{try{localStorage.setItem('cvb2',JSON.stringify(V))}catch(e){}};
const D=()=>(V.list.find(v=>v.id==V.cur)||V.list[0]).data;
function set(p,v){const a=p.split('.');let o=D();while(a.length>1)o=o[a.shift()];o[a[0]]=v}

/* ---------- Editor ---------- */
const inp=(p,l,v,r)=>`<label>${l}${r?`<textarea data-p="${p}" rows="${r}">${esc(v)}</textarea>`:`<input data-p="${p}" value="${esc(v)}">`}</label>`;
function ed(){
  const d=D(),c=d.cl;
  let h=`<details open><summary>Job description and keywords</summary>${inp('jd','Paste the job description, then open the Keyword match tab',d.jd,7)}</details>
<details><summary>Personal details</summary>${inp('name','Full name',d.name)}${inp('title','Headline',d.title)}${inp('email','Email',d.email)}${inp('phone','Phone',d.phone)}${inp('loc','Location',d.loc)}${inp('links','Links, one per line',d.links,3)}</details>
<details><summary>Professional summary</summary>${inp('summary','Summary',d.summary,7)}</details>`;
  for(const k in LISTS){
    const cf=LISTS[k];
    h+=`<details><summary>${cf.t}</summary><p class="hint">Tick an item to show it on the CV.</p>`;
    d[k].forEach((o,i)=>{
      h+=`<div class="ih"><input type="checkbox" data-p="${k}.${i}.on" ${o.on?'checked':''} aria-label="Show on CV"><details><summary>${esc(o[cf.h]||'Untitled')}</summary>${cf.f.map(([f,l,r])=>inp(`${k}.${i}.${f}`,l,o[f],r)).join('')}<div class="row"><button data-a="up:${k}:${i}">Move up</button><button data-a="dn:${k}:${i}">Move down</button><button data-a="rm:${k}:${i}">Remove</button></div></details></div>`;
    });
    h+=`<button class="add" data-a="add:${k}:0">Add item</button></details>`;
  }
  h+=`<details><summary>Cover letter</summary>${inp('cl.company','Company',c.company)}${inp('cl.role','Job title',c.role)}${inp('cl.manager','Hiring manager (optional)',c.manager)}${inp('cl.date','Date (blank = today)',c.date)}${inp('cl.body','Letter body. Blank line between paragraphs. Use {company}, {role}, {manager}.',c.body,16)}${inp('cl.sign','Sign-off',c.sign)}</details>`;
  $('#ed').innerHTML=h;
}

/* ---------- Preview ---------- */
const on=a=>a.filter(x=>x.on);
const sec=(t,h)=>h?`<h2>${t}</h2>${h}`:'';
const ul=s=>L(s).length?`<ul>${L(s).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
const contact=d=>[d.email,d.phone,d.loc,...L(d.links)].filter(Boolean).map(esc).join(' | ');
function cv(d){
  return `<h1>${esc(d.name)}</h1><p class="t">${esc(d.title)}</p><p class="c">${contact(d)}</p>`
  +sec('Professional Summary',d.summary?`<p>${esc(d.summary)}</p>`:'')
  +sec('Technical Skills',on(d.skills).map(s=>`<p><b>${esc(s.label)}:</b> ${esc(s.items)}</p>`).join(''))
  +sec('Professional Experience',on(d.exp).map(e=>`<div class="h"><b>${esc(e.role)}</b><span>${esc(e.dates)}</span></div><div class="s">${esc([e.org,e.loc].filter(Boolean).join(', '))}</div>${ul(e.b)}`).join(''))
  +sec('Projects',on(d.proj).map(p=>`<div class="h"><b>${esc(p.name)}</b><span>${esc(p.dates)}</span></div>${p.tech?`<div class="s">${esc(p.tech)}</div>`:''}${ul(p.b)}`).join(''))
  +sec('Education',on(d.edu).map(e=>`<div class="h"><b>${esc(e.degree)}</b><span>${esc(e.dates)}</span></div><div class="s">${esc(e.school)}</div>${ul(e.b)}`).join(''))
  +sec('Awards and Achievements',on(d.awards).length?`<ul>${on(d.awards).map(a=>`<li>${esc(a.text)}${a.dates?' | '+esc(a.dates):''}</li>`).join('')}</ul>`:'');
}
function cl(d){
  const c=d.cl;
  const f=s=>esc(String(s||'').replace(/\{company\}/g,c.company||'your company').replace(/\{role\}/g,c.role||'this role').replace(/\{manager\}/g,c.manager||'Hiring Manager'));
  const date=c.date||new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const addr=[c.manager,c.company].filter(Boolean).map(esc).join('<br>');
  return `<h1>${esc(d.name)}</h1><p class="c">${contact(d)}</p><p>${esc(date)}</p>${addr?`<p>${addr}</p>`:''}`
  +`<p><b>Re: Application for ${esc(c.role||'the advertised position')}</b></p><p>Dear ${esc(c.manager||'Hiring Manager')},</p>`
  +String(c.body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>`<p>${f(x.trim())}</p>`).join('')
  +`<p>${esc(c.sign)}<br><br><b>${esc(d.name)}</b></p>`;
}
const TECH='javascript,typescript,python,java,c#,c++,php,ruby,sql,nosql,html,css,sass,tailwind,react,next.js,vue,angular,node,express,django,flask,fastapi,spring,.net,asp.net,entity framework,graphql,rest,restful,api,apis,microservices,mysql,postgresql,mongodb,redis,sql server,oracle,firebase,supabase,docker,kubernetes,aws,azure,gcp,ci/cd,jenkins,github actions,git,linux,terraform,agile,scrum,jira,testing,unit testing,jest,cypress,playwright,selenium,tdd,oauth,jwt,authentication,websockets,machine learning,deep learning,tensorflow,pytorch,scikit-learn,pandas,numpy,nlp,computer vision,llm,data science,etl,power bi,tableau,erp,saas,react native,flutter,swift,kotlin,devops,cloud,security,debugging,code review,design patterns,oop,figma,n8n,postman,optimization,scalable'.split(',');
const STOP=new Set('about above after also and any are been being both but can cost could each etc for from have has into its more most must new not our out over per such than that the their them then there these they this those use used using was were what when where which while who will with within without work working you your able across including strong ability experience years year team teams role join company candidate looking responsibilities requirements required preferred skills knowledge good great well plus should would'.split(' '));
const norm=t=>String(t).toLowerCase().replace(/\breact\.?js\b/g,'react').replace(/\bnode\.?js\b/g,'node').replace(/\bnext\.?js\b/g,'next.js').replace(/\bvue\.?js\b/g,'vue').replace(/\bexpress\.?js\b/g,'express');
const has=(t,x)=>new RegExp('(^|[^a-z0-9+#.])'+x.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'(?![a-z0-9+#])').test(t);
function cvText(d){
  return norm([d.title,d.summary,...on(d.skills).map(s=>s.label+' '+s.items),...on(d.exp).map(e=>e.role+' '+e.org+' '+e.b),...on(d.proj).map(p=>p.name+' '+p.tech+' '+p.b),...on(d.edu).map(e=>e.degree+' '+e.b)].join(' \n '));
}
function kw(d){
  if(!d.jd.trim())return '<h2>Keyword match</h2><p>Paste a job description in the editor (first section) to see which keywords your CV already covers and which are missing.</p>';
  const jd=norm(d.jd),cvt=cvText(d);
  const terms=TECH.filter(x=>has(jd,x));
  const hit=terms.filter(x=>has(cvt,x)),miss=terms.filter(x=>!has(cvt,x));
  const cnt={};jd.split(/[^a-z0-9+#]+/).forEach(w=>{if(w.length>3&&!STOP.has(w)&&!TECH.includes(w))cnt[w]=(cnt[w]||0)+1});
  const other=Object.entries(cnt).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const chip=(w,ok,n)=>`<span class="chip ${ok?'ok':'no'}">${esc(w)}${n?' x'+n:''}</span>`;
  const pct=terms.length?Math.round(hit.length/terms.length*100):0;
  return `<h2>Keyword match</h2><p><span class="score">${pct}%</span> of ${terms.length} technical keywords in the job description appear in your CV.</p>
<h2>Missing technical keywords</h2><p>${miss.map(w=>chip(w,0)).join('')||'None. Nice.'}</p>
<h2>Already covered</h2><p>${hit.map(w=>chip(w,1)).join('')||'None yet.'}</p>
<h2>Other repeated words in the posting</h2><p>${other.map(([w,n])=>chip(w,has(cvt,w),n)).join('')||'None.'}</p>
<p class="hint">Only add a keyword to your CV if it is true for you. Tick or untick projects, reorder bullets and tweak the summary to mirror the posting's wording.</p>`;
}
function pv(){
  const d=D();
  $('#paper').className='paper'+(tab=='kw'?' kw':tab=='cl'?' cl':'');
  $('#paper').innerHTML=tab=='cv'?cv(d):tab=='cl'?cl(d):kw(d);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  document.title=d.name+' - '+(tab=='cl'?'Cover Letter'+(d.cl.company?' - '+d.cl.company:''):'CV');
}
function vers(){
  $('#ver').innerHTML=V.list.map(v=>`<option value="${v.id}" ${v.id==V.cur?'selected':''}>${esc(v.name)}</option>`).join('');
}

/* ---------- Events ---------- */
document.addEventListener('input',e=>{
  const p=e.target.dataset&&e.target.dataset.p;if(!p)return;
  set(p,e.target.type=='checkbox'?(e.target.checked?1:0):e.target.value);
  save();pv();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;pv();return}
  const a=e.target.closest('[data-a]');
  if(a){
    const [act,k,n]=a.dataset.a.split(':'),i=+n,arr=D()[k];
    if(act=='add')arr.push(clone(NEW[k]));
    if(act=='rm'&&confirm('Remove this item?'))arr.splice(i,1);
    if(act=='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(act=='dn'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
    save();ed();pv();return;
  }
  const g=e.target.closest('[data-g]');if(!g)return;
  const cur=V.list.find(v=>v.id==V.cur);
  if(g.dataset.g=='print')window.print();
  if(g.dataset.g=='new'){
    const n=prompt('Name this version (e.g. Acme - Backend Engineer):');if(!n)return;
    const id=Date.now();V.list.push({id,name:n,data:clone(cur.data)});V.cur=id;save();vers();ed();pv();
  }
  if(g.dataset.g=='blank'){
    const n=prompt('Name the blank version:');if(!n)return;
    const id=Date.now();V.list.push({id,name:n,data:clone(EMPTY)});V.cur=id;save();vers();ed();pv();
  }
  if(g.dataset.g=='ren'){const n=prompt('New name:',cur.name);if(n){cur.name=n;save();vers()}}
  if(g.dataset.g=='del'){
    if(V.list.length<2)return alert('You need at least one version.');
    if(confirm('Delete "'+cur.name+'"?')){V.list=V.list.filter(v=>v.id!=cur.id);V.cur=V.list[0].id;save();vers();ed();pv()}
  }
  if(g.dataset.g=='exp'){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(V,null,1)],{type:'application/json'}));
    a.download='cv-builder-backup.json';a.click();
  }
  if(g.dataset.g=='imp')$('#file').click();
});
$('#ver').addEventListener('change',e=>{V.cur=+e.target.value;save();ed();pv()});
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    try{const j=JSON.parse(t);if(!j.list||!j.list.length)throw 0;
      if(confirm('Replace all current versions with this backup?')){V=j;save();vers();ed();pv()}
    }catch(x){alert('That file is not a valid CV Builder backup.')}
    e.target.value='';
  });
});
vers();ed();pv();
</script>
</body>
</html>
